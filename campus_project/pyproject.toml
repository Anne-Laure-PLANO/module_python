[project]
name = "campus-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
no_implicit_optional = false

[tool.pytest.ini_options]
pythonpath = ["src"]

