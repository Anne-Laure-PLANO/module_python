[project]
name = "roman-numeral-kata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.dependency-groups.dev]
dependencies = [
    "ruff",
    "pytest",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=. --cov-fail-under=80"